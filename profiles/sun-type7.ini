# Sun Type 7 USB keyboard (0430:00a2), boot keyboard report, interrupt IN.
[device]
name=Sun Type 7
vid=0x0430
pid=0x00a2

[report]
endpoint=0x81
size=8
keys_offset=2
keys_count=6

[keys]
0x78=Stop|Esc
0x79=Again|Ctrl+Y
0x76=Props|Alt+Enter
0x7a=Undo|Ctrl+Z
0x77=Front|Alt+Tab
0x7c=Copy|Ctrl+C
0x74=Open|Ctrl+O
0x7d=Paste|Ctrl+V
0x7e=Find|Ctrl+F
0x7b=Cut|Ctrl+X
0x75=Help|F1
